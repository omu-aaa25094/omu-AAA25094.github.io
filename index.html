<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 0-1: HTML基礎確認</title>
    <style>
        #clock {
            font-size: 48px;
            font-weight: bold;
            color: #2b4cd8;
        }
    </style>
</head>
<body>
    <h2>現在時刻</h2>
    <p id="clock">--:--:--</p>

    <h1>🌐 Phase 0-1: HTML基礎確認</h1>

    <h3>お薦めな食べ物を紹介</h3>
    <img src="omurice.jpg" width="300" alt="オムライス">
    <img src="pasta.jpg" width="300" alt="パスタ">
    <ol>
        <li>オムライス</li>
        <li>パスタ</li>
    </ol>

    <a href="second.html">2ページ目へ</a>

    <script>
        // 1秒ごとに現在時刻を表示する
        function showClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, "0");
            const m = String(now.getMinutes()).padStart(2, "0");
            const s = String(now.getSeconds()).padStart(2, "0");
            document.getElementById("clock").textContent = h + ":" + m + ":" + s;
        }
        showClock();
        setInterval(showClock, 1000);
    </script>
</body>
</html>
