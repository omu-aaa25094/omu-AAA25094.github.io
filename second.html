<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 0-1: HTML基礎確認（2ページ目）</title>
</head>
<body>
    <h2>BMI指標計算</h2>
    <p>体重(kg)：<input type="number" id="weight" min="0" step="0.1"></p>
    <p>身長(cm)：<input type="number" id="height" min="0" step="0.1"></p>
    <p>BMI：<span id="bmi"></span></p>

    <h1>🌐 Phase 0-1: HTML基礎確認</h1>

    <h3>お薦めな旅行先を紹介</h3>
    <ol>
        <li>
            名古屋<br>
            <iframe
                src="https://maps.google.com/maps?q=%E5%90%8D%E5%8F%A4%E5%B1%8B%E9%A7%85&z=14&output=embed"
                width="600" height="400" style="border:0;" loading="lazy"
                allowfullscreen></iframe>
            <br>
            <a href="https://www.google.com/maps/search/?api=1&query=%E5%90%8D%E5%8F%A4%E5%B1%8B%E9%A7%85" target="_blank">Googleマップで名古屋駅を開く</a>
        </li>
    </ol>

    <a href="index.html">1ページ目へ戻る</a>

    <script>
        // 体重・身長が入力されるたびにBMIを計算する
        function calcBmi() {
            const weight = parseFloat(document.getElementById("weight").value);
            const heightCm = parseFloat(document.getElementById("height").value);
            const result = document.getElementById("bmi");
            if (weight > 0 && heightCm > 0) {
                const heightM = heightCm / 100;
                result.textContent = (weight / (heightM * heightM)).toFixed(1);
            } else {
                result.textContent = "";
            }
        }
        document.getElementById("weight").addEventListener("input", calcBmi);
        document.getElementById("height").addEventListener("input", calcBmi);
    </script>
</body>
</html>
